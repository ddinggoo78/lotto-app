name: 매주 당첨번호 업데이트
on:
  schedule:
    - cron: "0-50/10 12 * * 6"   # 토 21:00~21:50 (한국 시간) 10분마다 — 번호 올라오자마자 받기
    - cron: "0-30/10 13 * * 6"   # 토 22:00~22:30 — 늦게 올라올 때 대비
    - cron: "10 0 * * 0"    # 일 09:10 — 혹시 못 받았으면 다시
    - cron: "10 0 * * 1"    # 월 09:10 — 한 번 더 확인
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: lotto-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 동행복권에서 새 회차 받기
        run: python tools/update_data.py
      - name: 바뀐 데이터 저장
        run: |
          if git diff --quiet -- data; then echo "새 회차 없음"; exit 0; fi
          git config user.name "lotto-bot"
          git config user.email "lotto-bot@users.noreply.github.com"
          git add data
          git commit -m "당첨번호 자동 업데이트 $(date -u +%Y-%m-%d)"
          git push
      - name: 추첨 결과를 두 사람 핸드폰으로 알림
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then echo "알림 설정 전 — 건너뜀"; exit 0; fi
          pip install -q google-auth requests
          python tools/notify_results.py
